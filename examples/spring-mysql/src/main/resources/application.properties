spring.application.name=agent-spring-mysql-demo
spring.datasource.url=${APP_JDBC_URL}
spring.datasource.username=${APP_DB_USER}
spring.datasource.password=${APP_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.flyway.url=${APP_JDBC_URL}
spring.flyway.user=${MIGRATION_DB_USER}
spring.flyway.password=${MIGRATION_DB_PASSWORD}
spring.flyway.table=agent_demo_schema_history
spring.flyway.clean-disabled=true
spring.sql.init.mode=never
server.address=0.0.0.0
server.port=8080
